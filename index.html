<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Seguridad QR</title>
    <style>
        /* Reseteo básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fondo con degradado usando los colores proporcionados */
        body {
            background: linear-gradient(135deg, #6B3A8C 0%, #4B3659 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
            text-align: center;
        }

        /* Contenedor principal para limitar el ancho en móviles */
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* Estilo para el logo (arriba o a un costado) */
        .logo-container {
            width: 100%;
            display: flex;
            justify-content: flex-start; /* Lo alinea a la izquierda (un costado) */
            margin-bottom: 10px;
        }

        .logo-container img {
            max-width: 150px; /* Ajusta el tamaño del logo según sea necesario */
            height: auto;
            /* Si el logo es blanco sobre transparente, se verá perfecto. 
               Si tiene fondo blanco, podrías necesitar mix-blend-mode: multiply; */
        }

        /* Estilo para el texto principal */
        .main-text {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Contenedor de la imagen de ejemplo */
        .image-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            background-color: rgba(255, 255, 255, 0.1); /* Fondo sutil por si la imagen tarda en cargar */
            padding: 10px;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* Estilo para el texto secundario debajo de la imagen */
        .sub-text {
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.5;
            opacity: 0.9;
            padding: 0 10px;
        }

        /* Ajustes para pantallas muy pequeñas */
        @media (max-width: 360px) {
            .main-text { font-size: 1.2rem; }
            .sub-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO A UN COSTADO (IZQUIERDA) -->
        <div class="logo-container">
            <!-- Reemplaza 'logo.png' con la ruta real de tu imagen -->
            <img src="logo.png" alt="MysterIA">
        </div>

        <!-- TEXTO PRINCIPAL -->
        <h1 class="main-text">
            ¡Ups! ¿Revisaste el URL del QR antes de entrar?
        </h1>

        <!-- IMAGEN DE EJEMPLO -->
        <div class="image-container">
            <!-- Reemplaza 'imagen-ejemplo.jpg' con la ruta de tu imagen -->
            <!-- He usado un placeholder de seguridad para que veas cómo queda -->
            <img src="https://images.unsplash.com/photo-1614064641938-3bbee52942c7?q=80&w=600&auto=format&fit=crop" alt="Ejemplo de escaneo de QR">
        </div>

        <!-- TEXTO SECUNDARIO -->
        <p class="sub-text">
            Debes revisar SIEMPRE a donde te dirige un QR antes de ingresar a él
        </p>
    </div>

</body>
</html>
